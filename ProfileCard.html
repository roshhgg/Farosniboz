<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-500 min-h-screen flex item-center justify-center p-4 font-sans">

    <!-- div untuk card, ditutup sebelum </body> -->
    <div class="w-full max-w-sm bg-pink-300 rounded-2xl shadow-2xl overflow-hidden">

        <!-- div untuk header / avatar -->
        <div class="bg-pink-400 pt-8 pb-6 flex justify-center">


            <!-- div untuk border profile picture -->
        <div class="relative w-36 h-36 rounded-full border-pink border-4 overflow-hidden shadow-inner">
            <img src="oline.jpg" alt="Profile Picture" class="w-full h-full object-cover"/>
        </div>
        </div>

    <div class="p-6 text-center text-white space-y-4">
        <div>
        <h2 class="text-xl font-bold tracking-wide">Farosznibosz</h2>
        <div class="text items-center justify-center gap-1 text-xs text-pink-100 mt-1"></div>
        <p class="uppercase tracking-wider font-semibold">x-1 | SMA ABBS BOYOLALI</p>
        <p>Im a Spiderman</p>
    </div>
    <div class="flex justify-center gap-3 pt-2">
        <a href="https://github.com/roshhgg" target="_blank" class="px-5 py-2 bg-pink-600 hover:bg-pink-700 text-xs text-white font-medium rounded-lg shadow-md border border-pink-900 transition-colors">GitHub</a>
        <a href="https://www.instagram.com/roshhpy/" target="_blank" class="px-5 py-2 bg-pink-600 hover:bg-pink-700 text-xs text-white font-medium rounded-lg shadow-md border border-pink-900 transition-colors">Instagram</a>
    </div>


    <hr class="border-pink-800/60 my-4">    


    <div>
        <h3 class="text-xs font-bold tracking-wider text-pink-200 mb-2">Skills</h3>

        <div class="flex flex-wrap gap-4 text-xs text-pink-200">
            <span class="border px-3 py-1 rounded-full text-sm font-medium">HTML</span>
            <span class="border px-3 py-1 rounded-full text-sm font-medium">CSS</span>
            <span class="border px-3 py-1 rounded-full text-sm font-medium">JavaScript</span>
        </div>


    <hr class="border-pink-800/60 my-4">


    </div>
    <div class="text-left pt-1">
        <h3 class="text-xs font-bold tracking-wider text-pink-200 mb-2">SEND A MESSAGE</h3>
        <form action="#" method="POST" class="space-y-3">
            <div>
                <label for="name">Name</label>
                <input type="text" placeholder="Your Name" class="w-full px-3 py-2 text-xs bg-[#121235] text-white rounded border border-pink-900/80 focus:outline-none focus:border-pink500 placeholder:text-pink-400" required/> 
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" placeholder="Your Email" class="w-full px-3 py-2 text-xs bg-[#121235] text-white rounded border border-pink-900/80 focus:outline-none focus:border-pink500 placeholder:text-pink-400"required/> 
            </div>
            <div>
                <label for="message">Message</label>
                <textarea placeholder="Your Message" class="w-full px-3 py-2 text-xs bg-[#121235] text-white rounded border border-pink-900/80 focus:outline-none focus:border-pink500 placeholder:text-pink-400" required></textarea>
            </div>
            <button type="submit" class="w-full px-3 py-2 text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md shadow-md border border-indigo-900 transition-colors mt-4">Send Message</button>
        </form>
    </div>
</body>
</html>
