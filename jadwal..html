<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classroom cleaning record</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-500 p-8">
    
    <header>
        <nav class="container mx-auto flex justify-center items-center bg-pink-400 p-4 rounded-lg shadow-md">
            <ul class="flex justify-center space-x-4">
                <li><a href="#" class="text-pink-700 hover:text-pink-600">HOME</a></li>
                <li><a href="#" class="text-pink-700 hover:text-pink-600">ABOUT</a></li>
                <li><a href="schedul.html" class="text-pink-700 hover:text-pink-600">SCHEDULE</a></li>
        </nav>
    </header>
    <main class="flex justify-center">
        <section class="bg-pink-400 p-6 rounded-lg shadow-md w-full max-w-md my-8">
            <div class="text-left pt-1">
        <h3 class="text-center text-x font-bold tracking-wider text-pink-200 mb-2">Classroom Cleaning Form</h3>
        <form action="#" method="POST" class="space-y-8">
            <div class="mb-8">
                <label for="name">Name</label>
                <input type="text" placeholder="Your Name" class="w-full px-3 py-2 text-xs bg-[#121235] text-white rounded border border-pink-900/80 focus:outline-none focus:border-pink500 placeholder:text-pink-400" required/> 
            </div>
            <div class="mb-8">
                <label for="classroom">Classroom</label>
                    <select class="w-full px-3 py-2 text-xs bg-[#121235] text-pink-400 rounded border border-pink-900/80 focus:outline-none focus:border-pink-500 placeholder:text-pink-400" required>
                        <option value="" disabled selected>Your Classroom</option>
                        <option value="classroom1">X1</option>
                        <option value="classroom2">X2</option>
                        <option value="classroom3">X3</option>
                        <option value="classroom4">X4</option>
                    </select>
                </label>
            </div>
            <div class="mb-8">
                <label for="date">Date</label>
                <input type="date" placeholder="Your Date" class="w-full px-3 py-2 text-xs bg-[#121235] text-pink-400 rounded border border-pink-900/80 focus:outline-none focus:border-pink-500 placeholder:text-pink-400"required/> 
            </div>
            <div class="mb-8">
                <label for="job duties">Job Duties</label>
                <textarea placeholder="Your Job Duties" class="w-full px-3 py-2 text-xs bg-[#121235] text-white rounded border border-pink-900/80 focus:outline-none focus:border-pink-500 placeholder:text-pink-400" required></textarea>
            </div>
            <button type="submit" class="w-full px-3 py-2 text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md shadow-md border border-indigo-900 transition-colors mt-4">Send Message</button>
        </form>
    </div>
        </section>
    </main>
    <footer></footer>
    
</body>
</html>
